<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Certifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            font-family: 'Segoe UI', sans-serif;
        }

        /* Certification Card */
        .cert-card {
            transition: transform 0.4s, box-shadow 0.4s;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }
        .cert-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        /* Badge animations */
        .org-badge {
            font-weight: 500;
            font-size: 0.9rem;
            color: #fff;
            padding: 0.3rem 0.7rem;
            border-radius: 10px;
            background: linear-gradient(45deg, #0d6efd, #6f42c1, #fd7e14, #20c997, #ffc107, #dc3545);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
            display: inline-block;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .badge-verified { background-color: #198754; color: #fff; }
        .badge-pending { background-color: #6c757d; color: #fff; }
        #pdfModal iframe { width: 100%; height: 80vh; border: none; border-radius: 0 0 15px 15px; }

        .card-title { font-weight: 600; color: #0d6efd; }
        footer { background: #212529; color: #fff; }
        .footer-text a { color: #0d6efd; text-decoration: none; }
        .footer-text a:hover { text-decoration: underline; }

        /* Animations */
        .fade-in { animation: fadeIn 1s ease forwards; opacity: 0; }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Himanshu Singh</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link active fw-bold" href="/certifications">Certifications</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main content -->
<div class="container flex-grow-1 py-5">
    <h2 class="mb-5 text-center display-6 fw-bold">Certifications</h2>

    <!-- Filters -->
    <div class="row mb-4">
        <div class="col-md-6 mb-2">
            <input type="text" id="certSearch" class="form-control form-control-lg" placeholder="Search by name or organization...">
        </div>
        <div class="col-md-6 mb-2">
            <select id="organizationFilter" class="form-select form-select-lg">
                <option value="">All Organizations</option>
            </select>
        </div>
    </div>

    <!-- Certification Cards -->
    <div class="row" id="certTableBody">
        <div class="col-12 text-center">Loading...</div>
    </div>
</div>

<!-- PDF Modal -->
<div class="modal fade" id="pdfModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Certificate Preview</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <iframe id="pdfFrame" src=""></iframe>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-4 mt-auto">
    <p class="mb-0 footer-text">&copy; 2024 <span th:text="${profile?.name}">Himanshu Singh</span>. All rights reserved. <a href="/">Himanshu Singh</a></p>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function () {
        let certifications = [];
        let organizations = new Set();

        // Fetch certifications
        $.get("/certifications/list", function(list) {
            certifications = list;
            populateOrganizations(list);
            renderCerts(list);
        });

        function populateOrganizations(list) {
            const select = $("#organizationFilter");
            list.forEach(c => {
                if(c.organization) organizations.add(c.organization);
            });
            Array.from(organizations).sort().forEach(org => {
                select.append(`<option value="${org}">${org}</option>`);
            });
        }

        function renderCerts(list) {
            const container = $("#certTableBody");
            container.empty();

            if(list.length === 0){
                container.append('<div class="col-12 text-center"><p>No certifications found</p></div>');
                return;
            }

            list.forEach((c, index) => {
                container.append(`
            <div class="col-md-6 col-lg-4 mb-4 fade-in">
                <div class="card cert-card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="card-title">${c.name}</h5>
                            <h6 class="card-subtitle mb-2">
                                <span class="org-badge">${c.organization}</span>
                            </h6>
                            <p class="mb-1"><strong>Issue Date:</strong> ${c.issueDate || "-"}</p>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="badge ${c.verified ? 'badge-verified' : 'badge-pending'}">
                                ${c.verified ? '<i class="bi bi-check2-circle"></i> Verified' : 'Pending'}
                            </span>
                            ${c.certificateUrl ? `<button class="btn btn-outline-primary btn-sm view-pdf" data-url="${c.certificateUrl}">View</button>` : ''}
                        </div>
                    </div>
                </div>
            </div>
            `);
            });

            $(".view-pdf").click(function() {
                const url = $(this).data("url");
                $("#pdfFrame").attr("src", url);
                const pdfModal = new bootstrap.Modal(document.getElementById('pdfModal'));
                pdfModal.show();
            });
        }

        function filterCerts() {
            const query = $("#certSearch").val().toLowerCase();
            const org = $("#organizationFilter").val();
            const filtered = certifications.filter(c =>
                (c.name.toLowerCase().includes(query) || c.organization.toLowerCase().includes(query)) &&
                (org === "" || c.organization === org)
            );
            renderCerts(filtered);
        }

        $("#certSearch").on("input", filterCerts);
        $("#organizationFilter").on("change", filterCerts);
    });
</script>
</body>
</html>
