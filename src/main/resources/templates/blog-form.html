<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Admin Panel</a>
  </div>
</nav>

<div class="container py-5">
  <h2 class="mb-4 text-center">Write a New Blog</h2>

  <form th:action="@{/blogs/save}" th:object="${blog}" method="post" class="card shadow p-4">
    <div class="mb-3">
      <label class="form-label fw-bold">Title</label>
      <input type="text" class="form-control" th:field="*{title}" placeholder="Enter blog title" required>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Image URL</label>
      <input type="text" class="form-control" th:field="*{image}" placeholder="https://...">
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Content (HTML allowed)</label>
      <textarea class="form-control" th:field="*{content}" rows="10" placeholder="Write your blog content..." required></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Category</label>
      <select class="form-select" th:field="*{category.id}">
        <option value="" disabled selected>-- Select Existing Category --</option>
        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
      </select>
      <div class="mt-3">
        <label class="form-label">Or Add New Category</label>
        <input type="text" class="form-control" name="categoryName" placeholder="New category name (optional)">
      </div>
    </div>

    <div class="d-grid">
      <button type="submit" class="btn btn-primary btn-lg">Save Blog</button>
    </div>
  </form>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
  <p class="mb-0">&copy; 2025 Himanshu Singh. Admin Panel</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
