<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .error-page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
        }
        .error-card {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }
        .error-profile-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 1rem;
            border: 3px solid #fff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .error-btns {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container-fluid justify-content-between">
            <span class="navbar-brand">Portfolio Error</span>
            <div>
                <a href="/" class="btn btn-outline-light">Portfolio Home</a>
                <a href="/admin/login" class="btn btn-outline-light ms-2">Admin Login</a>
            </div>
        </div>
    </nav>
    <div class="error-page-container d-flex flex-column justify-content-center align-items-center" style="min-height:100vh;">
        <div class="error-card shadow-lg">
            <div class="card-header text-white text-center">
                <h2>Something Went Wrong</h2>
            </div>
            <div class="card-body text-center">
                <img src="/images/profile.jpg" alt="Profile" class="error-profile-img mb-3">
                <p class="lead mb-3">An unexpected error occurred.</p>
                <p>If you logged out, your session has ended. You can return to the portfolio home or log in again as admin.</p>
                <div class="error-btns">
                    <a href="/" class="btn btn-primary">Portfolio Home</a>
                    <a href="/admin/login" class="btn btn-secondary">Admin Login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
